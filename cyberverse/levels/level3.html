.b-ok{background:var(--cv-color-success)!important}.b-warn{background:var(--cv-color-warning)!important}.b-danger{background:var(--cv-color-danger)!important}
html{scroll-behavior:smooth}
/* screen transition: fade + settle + restrained blur, ~450ms, never blocks input */
.enter>*{animation:rise var(--cv-motion-screen) var(--cv-ease-enter) both}.enter>*:nth-child(2){animation-delay:60ms}.enter>*:nth-child(3){animation-delay:120ms}.enter>*:nth-child(n+4){animation-delay:180ms}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.995);filter:blur(var(--cv-blur-subtle))}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(6px);filter:blur(var(--cv-blur-subtle))}to{opacity:1;transform:none;filter:blur(0)}}
/* additive smoothness: first-load landing + staggered inner panels (motion only, no layout change) */
#app{animation:boot var(--dp-motion-normal) var(--dp-motion-easing-out)}
@keyframes boot{from{opacity:0;filter:blur(var(--dp-blur-subtle))}to{opacity:1;filter:blur(0)}}
.enter>.grid2>.panel,.enter>.cards .panel{animation:rise var(--dp-motion-normal) var(--dp-motion-easing-out) both}
.enter>.grid2>.panel:nth-child(2),.enter>.cards .panel:nth-child(2){animation-delay:90ms}
@media(max-width:1100px){:root{--dp-gap:18px}.grid2{grid-template-columns:1fr 1.5fr}}
@media(max-width:900px){.g2b{grid-template-columns:1fr}.mts{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.grid2,.hero{grid-template-columns:1fr}#app{padding:16px}.hero .frame::after{display:none}@keyframes rise{from{opacity:0;transform:translateY(6px);filter:blur(var(--dp-blur-subtle))}to{opacity:1;transform:none;filter:blur(0)}}}
@media(max-width:520px){.panel{padding:16px}.cards{grid-template-columns:1fr}.mts{grid-template-columns:1fr}button{min-height:44px}.btn-sm{min-height:40px}.chip{min-height:42px}.hud{padding:14px}.hero .frame{padding:12px}.hud-id .mi{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}button:hover:not(:disabled),.chip:hover,.cards>.panel:hover{transform:none!important}.ov{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(3,3,3,.94)}}
/* AMBIENT GLOW — additive only: static warm halo behind key cards (Financial palette; no existing rule touched) */
.cards>.panel:not(.lock){position:relative}
.cards>.panel:not(.lock)::before,.hero .frame::before{content:"";position:absolute;z-index:-1;pointer-events:none;inset:-26px -22px;border-radius:36px;background:radial-gradient(62% 58% at 50% 64%,rgba(63,214,198,.07),rgba(63,214,198,.035) 46%,transparent 74%);filter:blur(12px)}
/* SHIFT SLIDER — continuous-feeling drag (logic stays integer via Math.round); additive: grooved track + visible thumb with hover/active states */
input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:var(--dp-color-line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--dp-color-accent);border:2px solid var(--dp-color-ground);box-shadow:0 0 0 1px var(--dp-color-line);transition:box-shadow var(--dp-motion-interaction) var(--dp-motion-easing),background-color var(--dp-motion-interaction) var(--dp-motion-easing)}
input[type=range]:hover::-webkit-slider-thumb{background:#7ce4d8}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(63,214,198,.25)}
input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:var(--dp-color-line)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--dp-color-accent);border:2px solid var(--dp-color-ground)}
</style></head><body><div id="app"></div>
<script>
const KEY='cyb3_level3_progress',HINT_PEN=20;
const def=()=>({xp:{},hint:{},l3done:false,l4unlocked:false,l4done:false,keys:[],time:{3:0,4:0},started:false});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),app=$('#app');
const total=()=>Object.values(S.xp).reduce((a,b)=>a+b,0);
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const norm=s=>s.toUpperCase().replace(/\s+/g,' ').trim();
const caesar=(t,s)=>t.replace(/[A-Z]/g,c=>String.fromCharCode(((c.charCodeAt(0)-65-s)%26+26)%26+65));
const hintsUsed=l=>Object.keys(S.hint).filter(k=>k[0]==(l==3?'c':'i')||(l==4&&k=='fd')).length;
let cur=null,tick=null,step=0,solved=false,pen=0,sel=new Set(),fbHtml='',bin=[];
/* inline SVG icon set — one family: 24 viewBox, stroke 2, round caps; decorative (text carries the meaning) */
const FI=p=>'<svg class="fi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const IC_OK=FI('<path d="M20 6 9 17l-5-5"/>');
const IC_WARN=FI('<path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>');
const IC_BULB=FI('<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>');
const IC_CLOCK=FI('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>');
const IC_KEY=FI('<path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>');
const IC_LOCK=FI('<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>');
const IC_UNLOCK=FI('<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>');
const IC_CBON=FI('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8.5 12 2.5 2.5 5-5"/>');
const IC_CBOFF=FI('<rect x="3" y="3" width="18" height="18" rx="4"/>');
function startTimer(l){stopTimer();cur=l;tick=setInterval(()=>{S.time[l]++;save();const e=$('#tm');if(e)e.textContent=fmt(S.time[l])},1000)}
function stopTimer(){clearInterval(tick);cur=null}
function award(id,base){if(S.xp[id]!=null)return 0;const v=Math.max(0,base-(S.hint[id]?HINT_PEN:0));S.xp[id]=v;save();pop('+'+v+' XP');return v}
function pop(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),160)},1640)}/* same 1800ms lifetime, +blur/fade exit */
function overlay(title,sub,ms,cb){const o=document.createElement('div');o.className='ov';o.innerHTML='<h1>'+title+'</h1><p class="sub">'+sub+'</p><div class="bar" style="width:260px"><i style="width:0"></i></div>';document.body.appendChild(o);setTimeout(()=>o.querySelector('i').style.width='100%',50);setTimeout(()=>{o.classList.add('exiting');setTimeout(()=>{o.remove();cb&&cb()},180)},ms)}
const keysHtml=()=>[3,4].map(k=>'<span class="key '+(S.keys.includes(k)?'':'off')+'">'+(S.keys.includes(k)?IC_KEY:IC_LOCK)+'KEY 0'+k+'</span>').join('');
function hud(l,prog,label){return '<div class="panel hud"><div class="hud-id"><b>CYBERVERSE</b><span class="sep"></span><span>LEVEL '+l+'</span><span class="sep"></span><span class="mi">'+label+'</span></div><div><span class="kpi">XP: <b>'+total()+'</b></span><span class="sep"></span><span class="kpi">'+IC_CLOCK+'<b id="tm">'+fmt(S.time[l])+'</b></span><span class="sep"></span><span class="kpi">Hint: <b>'+hintsUsed(l)+'</b></span> '+keysHtml()+' <button class="w btn-sm" onclick="askReset()">RESET</button></div><div class="bar" style="width:100%"><i style="width:'+prog+'%"></i></div></div>'}
let curScr='',viaGo=false,enterT=0;
function go(s,anim){stopTimer();fbHtml='';solved=false;sel=new Set();pen=0;const a=anim!==false&&s!==curScr;curScr=s;clearTimeout(enterT);app.classList.remove('enter');viaGo=true;({menu,select,l3,l3end,l4,win,report})[s]();viaGo=false;
if(a){void app.offsetWidth;app.classList.add('enter');enterT=setTimeout(()=>app.classList.remove('enter'),800)}window.scrollTo(0,0)}
function loadScreen(next){overlay('LOADING…','Đang kết nối CYBERVERSE',700,next)}
/* ---------- MENU ---------- */
function menu(){app.innerHTML='<div class="hero"><div><p class="sub">CYBERVERSE PRESENTS</p><h1>THE LAST FIREWALL</h1><p style="color:var(--dp-color-accent);font-weight:600">Hai nhiệm vụ. Một hệ thống. Hãy bảo vệ CYBERVERSE.</p><p class="sub">Năm 2089, một cuộc tấn công mạng đã làm suy yếu tường lửa (Firewall) cuối cùng của CYBERVERSE. Bạn là Đặc vụ mạng (Cyber Agent) và phải khôi phục hệ thống. Mọi dữ liệu trong game đều là giả lập.</p><button class="g" onclick="go(\'select\')">KHỞI ĐỘNG HỆ THỐNG</button> <button onclick="askReset()">RESET</button></div><div class="frame"><svg viewBox="0 0 320 260" role="img" aria-label="Bốn thành phần hội tụ về CYBERVERSE"><defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FD6C6"/><stop offset="1" stop-color="#9FEFE6"/></linearGradient></defs><circle cx="160" cy="130" r="92" fill="none" stroke="#222222"/><g stroke="#303030" stroke-width="1.5"><line x1="95" y1="52" x2="160" y2="130"/><line x1="225" y1="52" x2="160" y2="130"/><line x1="95" y1="208" x2="160" y2="130"/><line x1="225" y1="208" x2="160" y2="130"/></g><circle cx="160" cy="130" r="40" fill="url(#gb)"/><text x="160" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">CYBERVERSE</text><g fill="#0e0e0e" stroke="#222222"><rect x="40" y="36" width="110" height="32" rx="8"/><rect x="170" y="36" width="110" height="32" rx="8"/><rect x="40" y="192" width="110" height="32" rx="8"/><rect x="170" y="192" width="110" height="32" rx="8"/></g><g font-size="13" fill="#f2f2f2" text-anchor="middle"><text x="95" y="57">Identity</text><text x="225" y="57">Encryption</text><text x="95" y="213">Backup</text><text x="225" y="213">Firewall</text></g></svg></div></div>'}
function select(){
app.innerHTML='<div class="panel hud"><div>XP: <b>'+total()+'</b> / 2000</div><div>'+keysHtml()+'</div></div><div class="cards">'+
'<div class="panel"><h2>LEVEL 3 – ENCRYPTION CORE</h2><p style="color:var(--g)">UNLOCKED'+(S.l3done?' • COMPLETE':'')+'</p><p class="sub">Giải mã (Decryption) thông điệp bằng Caesar Cipher và hệ nhị phân (Binary) để khôi phục hệ thống liên lạc.</p><button class="g" onclick="enter(3)">'+(S.l3done?'PLAY AGAIN (không cộng XP)':S.started?'CONTINUE':'START')+'</button></div></div>'+
'<button class="w" onclick="askReset()">RESET</button> <button onclick="go(\'menu\')">MAIN MENU</button>'}
function enter(l){if(l==4)return;if(l==3)rollShift();S.started=true;save();loadScreen(()=>{if(l==3){step=Math.max(0,['c1','c2','c3'].findIndex(i=>S.xp[i]==null));go('l3')}else{step=Math.max(0,['i1','i2','i3','fd'].findIndex(i=>S.xp[i]==null));go('l4')}})}
/* ---------- LEVEL 3 ---------- */
let CH,INC,FD,SC;
let shift=1;
function rollShift(){/* new cipher target at each round start: fresh integer in [1,25]; both Caesar challenges re-encoded with the SAME target so the 'same Shift as Challenge 1' hint stays true */
if(!CH)return;const sh=1+Math.floor(Math.random()*25);CH[0].enc=caesar(CH[0].ans,-sh);CH[2].enc=caesar(CH[2].ans,-sh);CH[0].edu=CH[0].edu.replace(/Shift\s*=\s*\d+/,'Shift = '+sh)}
function l3(){const c=CH[step],done=S.xp[c.id]!=null;if(!viaGo)app.classList.remove('enter');if(!S.l3done)startTimer(3);
let h=hud(3,(step+(solved?1:0))/3*100,'ENCRYPTION CORE – Thử thách '+(step+1)+'/3: '+c.name)+'<div class="panel"><h2>'+c.name+'</h2><p class="sub"><b>Tình huống – '+SC.title+':</b> '+SC.sit+'</p><p class="sub">'+(step==0?'Hệ thống phát hiện một thông điệp bị mã hóa (Encryption). Hãy giải mã để khôi phục liên lạc.':step==2?'Thông điệp mã hóa cuối cùng':'Tín hiệu nhị phân (Binary) nhận được')+(S.xp[c.id]!=null&&!solved?' • (đã hoàn thành – chế độ luyện tập, không cộng XP)':'')+'</p>';
if(c.id=='c2'){h+='<p class="sub">Thứ tự các nhóm 8 bit đã bị xáo trộn. Bấm vào từng nhóm để giải mã; sau đó tự sắp xếp các ký tự đã giải mã thành thông điệp có nghĩa. Bấm GIẢI MÃ TẤT CẢ để giải mã tất cả.</p><div class="chips">'+c.enc.split(' ').map((b,i)=>'<div class="chip '+(bin[i]?'done':'')+'" tabindex="0" role="button" aria-label="Giải mã nhóm '+(i+1)+'" onclick="decBit('+i+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();decBit('+i+')}">'+b+'<br>'+(bin[i]?parseInt(b,2)+' → <b>'+String.fromCharCode(parseInt(b,2))+'</b>':'?')+'</div>').join('')+'</div><button onclick="decAll()">GIẢI MÃ TẤT CẢ</button>'}
else{h+='<div class="mono">'+c.enc+'</div><p class="sub">BẢNG CHỮ CÁI: ABCDEFGHIJKLMNOPQRSTUVWXYZ</p><p>ĐỘ DỊCH (Shift): <b id="sv" style="color:var(--cv-color-value)">'+shift+'</b></p><input type="range" min="1" max="25" step="0.25" value="'+shift+'" aria-label="ĐỘ DỊCH (Shift)" oninput="shift=Math.round(+this.value);updRaf()" onchange="this.value=shift"><p class="sub">KẾT QUẢ GIẢI MÃ TRỰC TIẾP:</p><div class="mono" id="prev">'+caesar(c.enc,shift)+'</div>'}
h+='<p><label for="ans">NHẬP ĐÁP ÁN:</label><input type="text" id="ans" autocomplete="off" '+(solved?'disabled':'')+' onkeydown="if(event.key==\'Enter\')chk3()"></p><button class="g" onclick="chk3()" '+(solved?'disabled':'')+'>GIẢI MÃ THÔNG ĐIỆP</button> <button class="w" onclick="hint(\''+c.id+'\')">HINT'+(S.hint[c.id]||done?'':' (-'+HINT_PEN+' XP)')+'</button><div id="fb">'+fbHtml+'</div></div>';
app.innerHTML=h+aux3()}
function upd(){const c=CH[step];$('#sv').textContent=shift;$('#prev').textContent=caesar(c.enc,shift);labUpd()}
let _ur=0;function updRaf(){cancelAnimationFrame(_ur);_ur=requestAnimationFrame(upd)}/* batch slider oninput → 1 DOM pass/frame */
function decBit(i){bin[i]=1;lastBit=i;keepAns(l3)}
function decAll(){const n=CH[1].enc.split(' ').length;for(let i=0;i<n;i++)bin[i]=1;lastBit=n-1;keepAns(l3)}
function keepAns(f){const v=($('#ans')||{}).value;f();if(v!=null&&$('#ans'))$('#ans').value=v}
function hint(id){const c=CH.find(x=>x.id==id)||INC.find(x=>x.id==id)||FD;if(S.xp[id]==null&&!S.hint[id]){S.hint[id]=true;save()}
fbHtml='<div class="fb no"><h3>'+IC_BULB+' HINT</h3><p>'+c.hint+'</p>'+(S.xp[id]==null?'<p class="sub">Phạt Hint: -'+HINT_PEN+' XP (chỉ trừ 1 lần cho mỗi nhiệm vụ).</p>':'')+'</div>';
const v=($('#ans')||{}).value;(S.keys.length||id[0]=='c'?(id[0]=='c'?l3:l4):l4)();if(v!=null&&$('#ans'))$('#ans').value=v}
function chk3(){const c=CH[step];if(solved)return;const a=norm($('#ans').value);
let right=a==c.ans;if(c.id=='c2'&&right&&bin.filter(Boolean).length<5){/* player may type answer after using decoder */}
if(!right){fbHtml='<div class="fb no"><h3>'+IC_WARN+' RETRY</h3><p>'+(a?'"'+a.replace(/[<>&]/g,'')+'" chưa phải thông điệp gốc. ':'Hãy nhập đáp án. ')+(c.id=='c2'?'Kiểm tra lại: mỗi nhóm 8 bit → số thập phân → ký tự ASCII (65 = A).':'Điều chỉnh Shift cho đến khi phần giải mã thành những từ tiếng Anh có nghĩa rồi gõ lại.')+'</p></div>';return l3a()}
const v=award(c.id,c.xp);solved=true;
fbHtml='<div class="fb ok"><h3>'+IC_OK+' SUCCESS '+(v?'+'+v+' XP':'(luyện tập – không cộng XP)')+'</h3><p>'+c.edu+'</p><button class="g" onclick="next3()">'+(step<2?'NEXT':'HOÀN TẤT')+'</button></div>';l3a();$('#ans').value=c.ans}
function l3a(){const v=($('#ans')||{}).value;l3();if($('#ans'))$('#ans').value=v}
function next3(){if(step<2){step++;shift=1;bin=[];go('l3',false)}else{const first=!S.l3done;if(first){S.l3done=true;S.l4unlocked=true;if(!S.keys.includes(3))S.keys.push(3);save()}stopTimer();overlay('GIẢI MÃ THÀNH CÔNG','Đã khôi phục ENCRYPTION CORE',1500,()=>go('l3end'))}}
function l3end(){const x=S.xp;app.innerHTML=hud(3,100,'COMPLETE')+'<div class="panel center" style="padding-top:20px"><h1 style="font-size:40px">ĐÃ KHÔI PHỤC ENCRYPTION CORE</h1><p>XP Level 3: <b style="color:var(--g)">'+((x.c1||0)+(x.c2||0)+(x.c3||0))+' / 1000</b> | Thời gian: <b>'+fmt(S.time[3])+'</b> | Hint đã dùng: <b>'+hintsUsed(3)+'</b></p><p>'+IC_UNLOCK+' Đã mở khóa bảo mật (Security Key) 03</p> <button onclick="go(\'select\')">MISSION</button></div>'}
/* ---------- LEVEL 4 ---------- */
const NODES=['Identity Core','Backup System','Encryption Core','Firewall'];
function stats(){const d=id=>S.xp[id]!=null,f=d('fd');let h=35,i=30,s=30,n=30;INC.forEach(c=>{if(d(c.id)){h+=c.fx.h||0;i+=c.fx.i||0;s+=c.fx.s||0;n+=c.fx.n||0}});if(f){h=i=s=n=100}return{h:Math.max(5,Math.min(100,h-pen)),i:Math.min(100,i),s:Math.min(100,s),n:Math.min(100,n)}}
const sb=(n,v,c)=>'<p style="margin:8px 0 2px">'+n+': <b style="color:'+c+'">'+v+'%</b></p><div class="bar"><i style="width:'+v+'%;background:'+c+'"></i></div>';
function l4(){if(!(S.l4unlocked&&S.l3done))return go('select');if(!viaGo)app.classList.remove('enter');if(!S.l4done)startTimer(4);const st=stats(),all=INC.concat([{id:'fd',name:'QUYẾT ĐỊNH CUỐI CÙNG'}]),inc=step<3?INC[step]:null;

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ld(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let SESS=null;
function newSession(){let used=ld(CKEY,[]);if(!Array.isArray(used))used=[];const prev=SESS&&SESS.id;let pool=SCN.filter(s=>!used.includes(s.id));
 if(!pool.length){used=[];pool=SCN.filter(s=>s.id!=prev)}
 const s=pool[Math.floor(Math.random()*pool.length)];used.push(s.id);sv(CKEY,used);SESS={id:s.id,seed:1+Math.floor(Math.random()*1e9)};sv(SKEY,SESS);buildSession(SESS)}
function initSession(){const s=ld(SKEY,null);if(s&&typeof s.seed=='number'&&SCN.some(x=>x.id==s.id)){SESS=s;buildSession(s)}else newSession()}
function buildSession(se){const sc=SCN.find(x=>x.id==se.id),r=rng(se.seed);SC=sc;
const sh=1+Math.floor(r()*25),bits=w=>w.split('').map(ch=>ch.charCodeAt(0).toString(2).padStart(8,'0')).join(' '),c0=sc.w2.charCodeAt(0),b0=bits(sc.w2).split(' ');let e2;do{e2=shuf(b0,r).join(' ')}while(e2===b0.join(' ')&&b0.length>1);
