<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CYBERVERSE – The Last Firewall</title>
<style>
:root{--bg:#050505;--panel:#0e0e0e;--line:#222;--tx:#fff;--mut:#8a8a8a;--ac:#3FD6C6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:clamp(24px,5vw,64px) 20px}
.eyebrow{color:var(--ac);font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.2em}
h1{font-size:clamp(34px,6vw,64px);margin:10px 0 8px;letter-spacing:-.02em}
.lead{color:var(--mut);max-width:620px;line-height:1.6;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:inherit;transition:border-color .25s,transform .25s,box-shadow .25s}
.card:hover,.card:focus-visible{border-color:var(--ac);transform:translateY(-3px);box-shadow:0 8px 30px rgba(63,214,198,.08);outline:none}
.n{color:var(--ac);font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.15em}
.card h2{margin:0;font-size:20px}.card p{margin:0;color:var(--mut);font-size:14px;line-height:1.55;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mut)}
.save{color:var(--ac)}
footer{margin-top:36px;color:var(--mut);font-size:12px}
</style></head><body><main>
<div class="eyebrow">CYBERVERSE PRESENTS</div>
<h1>THE LAST FIREWALL</h1>
<p class="lead">Choose any level. Each level runs independently and keeps its own saved progress in your browser.</p>
<div class="grid" id="g"></div>
<footer>All in-game data is simulated.</footer>
</main>
<script>
var L=[
{n:1,t:'Identity Breach',d:'Protect accounts and identity: spot weak credentials and secure access.',k:'cyberEscape.lv1.save.v1'},
{n:2,t:'Phishing Storm',d:'The inbox is the new battlefield. Trust nothing, verify everything.',k:'cyberEscape.lv2.save.v1'},
{n:3,t:'Encryption Core',d:'Decrypt messages with Caesar cipher and binary to restore communications.',k:'cyb3_level3_progress'},
{n:4,t:'Final Firewall',d:'Incident response: handle security incidents and restore THE LAST FIREWALL.',k:'cyb4_level4_progress'},
{n:5,t:'Final Firewall: System Override',d:'Every layer has fallen. Only verification remains. Four phases to the finale.',k:'cyberEscape.lv5.save.v1'}];
var g=document.getElementById('g');
L.forEach(function(l){var s='';try{if(localStorage.getItem(l.k))s='SAVE FOUND'}catch(e){}
var a=document.createElement('a');a.className='card';a.href='/levels/level'+l.n+'.html';
a.innerHTML='<span class="n">LEVEL 0'+l.n+'</span><h2></h2><p></p><div class="foot"><span class="save">'+s+'</span><span>PLAY →</span></div>';
a.querySelector('h2').textContent=l.t;a.querySelector('p').textContent=l.d;g.appendChild(a)});
</script></body></html>
